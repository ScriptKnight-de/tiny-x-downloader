# One-off: can REGISTRY_TOKEN create releases? Creates a draft, deletes it. Delete this file afterwards.
name: probe-token
on:
  workflow_dispatch:

jobs:
  can-create-release:
    runs-on: docker
    steps:
      - name: create + delete a draft release with REGISTRY_TOKEN
        env:
          T: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          api=https://forgejo.scriptknight.de/api/v1/repos/scriptknight/tiny-x-downloader
          code=$(curl -s -o r.json -w '%{http_code}' -X POST -H "Authorization: token $T" -H "Content-Type: application/json" \
            -d '{"tag_name":"probe-delete-me","target_commitish":"main","name":"probe","draft":true}' "$api/releases")
          echo "create draft -> $code"
          [ "$code" = 201 ] || exit 1
          id=$(python3 -c 'import json;print(json.load(open("r.json"))["id"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: token $T" "$api/releases/$id")
          echo "delete draft -> $code"
          [ "$code" = 204 ]
