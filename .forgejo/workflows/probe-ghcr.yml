# One-off diagnostic, delete afterwards.
name: probe-ghcr
on:
  workflow_dispatch:

env:
  PKG_URL: https://api.github.com/user/packages/container/tiny-x-downloader

jobs:
  is-public:
    runs-on: docker
    steps:
      - name: visibility == public
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$PKG_URL" > p.json
          python3 -c 'import json;d=json.load(open("p.json"));print(d.get("visibility"),d.get("html_url"));raise SystemExit(0 if d.get("visibility")=="public" else 1)'

  is-linked:
    runs-on: docker
    steps:
      - name: package is linked to a repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$PKG_URL" > p.json
          python3 -c 'import json;d=json.load(open("p.json"));print(d.get("repository"));raise SystemExit(0 if d.get("repository") else 1)'

  exists:
    runs-on: docker
    steps:
      - name: package exists (HTTP 200)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$PKG_URL")" = 200 ]
