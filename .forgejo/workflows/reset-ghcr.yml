# One-off: delete the GHCR package so the next image build recreates it with the right
# source label (and public access inherited from the repo). Delete this file afterwards.
name: reset-ghcr
on:
  workflow_dispatch:

env:
  PKG_URL: https://api.github.com/user/packages/container/tiny-x-downloader

jobs:
  found:
    runs-on: docker
    steps:
      - name: Package exists (HTTP 200)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$PKG_URL")
          echo "GET package -> $code"
          [ "$code" = 200 ]

  auth-ok:
    runs-on: docker
    steps:
      - name: Token is accepted (not 401/403)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$PKG_URL")
          [ "$code" != 401 ] && [ "$code" != 403 ]

  delete:
    needs: found
    runs-on: docker
    steps:
      - name: Delete the package (HTTP 204)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$PKG_URL")
          echo "DELETE package -> $code"
          [ "$code" = 204 ]
