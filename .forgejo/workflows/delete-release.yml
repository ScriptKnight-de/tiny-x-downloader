# One-off: delete the GitHub release v0.3.2 (the git tag stays). Delete this file afterwards.
name: delete-release
on:
  workflow_dispatch:

env:
  REL_URL: https://api.github.com/repos/ScriptKnight-de/tiny-x-downloader/releases/450745984

jobs:
  found:
    runs-on: docker
    steps:
      - name: release 450745984 exists and is v0.3.2
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$REL_URL" > r.json
          python3 -c 'import json;d=json.load(open("r.json"));print(d.get("id"),d.get("tag_name"));raise SystemExit(0 if d.get("tag_name")=="v0.3.2" else 1)'

  delete:
    needs: found
    runs-on: docker
    steps:
      - name: delete the release (HTTP 204)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$REL_URL")
          echo "DELETE release -> $code"
          [ "$code" = 204 ]
