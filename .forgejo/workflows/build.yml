# Builds the Alpine-based image and publishes it to the Forgejo container registry.
#
# Required repository secrets (Settings > Actions > Secrets):
#   REGISTRY_USER   Forgejo username that owns the package (scriptknight)
#   REGISTRY_TOKEN  access token with the write:package scope
#
# Runner: label "docker". The runner talks to a dind daemon; job containers reach it
# through the "dind" alias (runner config: container.options "--add-host=dind:host-gateway").
name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: forgejo.scriptknight.de
  IMAGE: forgejo.scriptknight.de/scriptknight/x-downloader

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" && pytest -q

  image:
    needs: test
    runs-on: docker
    env:
      DOCKER_HOST: tcp://dind:2375
    steps:
      - uses: actions/checkout@v4

      - name: Ensure docker CLI
        run: |
          if ! command -v docker >/dev/null; then
            apt-get update -qq && apt-get install -y -qq docker.io
          fi
          for i in 1 2 3 4 5; do docker version && break; sleep 3; done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
