[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-x-downloader"
version = "0.3.0"
description = "Daily sync of the images and videos from your liked and bookmarked X (Twitter) posts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["gallery-dl>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tiny-x-downloader = "tiny_x_downloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_x_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
