[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-downloader"
version = "0.2.0"
description = "Daily sync of the images and videos from your liked and bookmarked X (Twitter) posts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["gallery-dl>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
x-downloader = "x_downloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/x_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
