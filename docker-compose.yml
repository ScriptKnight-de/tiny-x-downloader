services:
  tiny-x-downloader:
    build: .
    # Pre-built image from GitHub Container Registry; `docker compose up --build` builds locally instead
    image: ${TINY_X_DOWNLOADER_IMAGE:-ghcr.io/scriptknight-de/tiny-x-downloader:latest}
    container_name: tiny-x-downloader
    restart: unless-stopped
    # Run as your host user so downloaded files are owned by you
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      X_SYNC_TIME: ${X_SYNC_TIME:-04:00}
      X_RUN_ON_START: ${X_RUN_ON_START:-false}
      X_GOTIFY_URL: ${X_GOTIFY_URL:-}
      X_GOTIFY_TOKEN: ${X_GOTIFY_TOKEN:-}
      X_NTFY_URL: ${X_NTFY_URL:-}
      X_NTFY_TOKEN: ${X_NTFY_TOKEN:-}
      X_WEBHOOK_URL: ${X_WEBHOOK_URL:-}
      X_COOKIE_WARN_DAYS: ${X_COOKIE_WARN_DAYS:-7}
    volumes:
      # folder containing cookies.txt exported from your logged-in browser (read-only)
      - ${X_CONFIG_DIR:-./config}:/config:ro
      # archive DB = memory of already downloaded posts; keep it persistent!
      - ${X_DATA_DIR:-./data}:/data
      # downloaded media; you may move files out of here freely
      - ${X_DOWNLOADS_DIR:-./downloads}:/downloads
